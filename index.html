<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiho Kang</title>
<meta name="description" content="Jiho Kang, Ph.D. student at KAIST.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--fg:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--bg:#ffffff;--link:#0a5bd8}
  @media (prefers-color-scheme: dark){:root{--fg:#f5f5f7;--sub:#a1a1a6;--line:#2c2c2e;--bg:#111113;--link:#6aa8ff}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;line-height:1.6}
  main{max-width:520px;width:100%}
  h1{font-size:34px;font-weight:600;letter-spacing:-.02em}
  .role{color:var(--sub);margin-top:4px;font-size:16px}
  hr{border:0;border-top:1px solid var(--line);margin:28px 0}
  p{font-size:15px;color:var(--sub)}
  .links{display:flex;gap:18px;margin-top:18px;font-size:15px}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Jiho Kang</h1>
  <div class="role">Ph.D. Student · KAIST</div>
  <hr>
  <p>This homepage is under construction.</p>
